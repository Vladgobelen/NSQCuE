<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      /* 🔥 ЧЕРНЫЙ ФОН НА ВСЁ ОКНО */
      background: rgba(30, 30, 30, 0.95) !important;
      border: 1px solid #444;
      border-radius: 4px;
      border-left: 3px solid #2a82da;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
    }
    
    .notification {
      padding: 6px 10px;
      width: 100%;
      cursor: pointer;
      animation: slideIn 0.2s ease;
    }
    
    .notification:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .notification.fade-out {
      animation: slideOut 0.15s ease forwards;
    }
    
    @keyframes slideOut {
      to { opacity: 0; transform: translateX(-8px); }
    }
    
    .title {
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      line-height: 1.4;
    }
    
    .body {
      color: #bbb;
      font-size: 11px;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="notification" id="notification">
    <div class="title" id="title"></div>
    <div class="body" id="body"></div>
  </div>
  
  <script>
    const { ipcRenderer } = require('electron');
    const container = document.getElementById('notification');
    const titleEl = document.getElementById('title');
    const bodyEl = document.getElementById('body');
    
    let hideTimeout = null;
    
    function closeNotification() {
      if (hideTimeout) {
        clearTimeout(hideTimeout);
        hideTimeout = null;
      }
      container.classList.add('fade-out');
      setTimeout(() => {
        ipcRenderer.send('close-notification-window');
      }, 150);
    }
    
    ipcRenderer.on('show-notification', (event, data) => {
      titleEl.textContent = data.title || '';
      bodyEl.textContent = data.body || '';
      
      container.onclick = () => {
        ipcRenderer.send('notification-clicked');
        closeNotification();
      };
      
      hideTimeout = setTimeout(closeNotification, 5000);
    });
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeNotification();
    });
  </script>
</body>
</html>
