<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Уведомление</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background: transparent;
  overflow: hidden;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #ffffff;
}

.notification {
  --kind: #2a82da;
  --kind-soft: rgba(42, 130, 218, 0.16);
  position: relative;
  width: 100%;
  padding: 8px 10px 10px 10px;
  background: linear-gradient(135deg, rgba(38, 38, 38, 0.97), rgba(24, 24, 24, 0.97));
  border: 1px solid #444444;
  border-left: 3px solid var(--kind);
  border-radius: 6px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  cursor: pointer;
  overflow: hidden;
  animation: slideIn 0.18s ease;
}

.notification[data-kind="chat"] {
  --kind: #2a82da;
  --kind-soft: rgba(42, 130, 218, 0.16);
}

.notification[data-kind="addon-update"] {
  --kind: #2ecc71;
  --kind-soft: rgba(46, 204, 113, 0.16);
}

.notification[data-kind="addon-error"] {
  --kind: #e74c3c;
  --kind-soft: rgba(231, 76, 60, 0.16);
}

.notification:hover {
  border-color: #5a5a5a;
  border-left-color: var(--kind);
}

.notification.fade-out {
  animation: slideOut 0.15s ease forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes slideOut {
  to { opacity: 0; transform: translateX(-10px); }
}

.head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  background: var(--kind-soft);
  color: var(--kind);
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.kind {
  flex: 1;
  min-width: 0;
  color: var(--kind);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.close {
  flex-shrink: 0;
  color: #777777;
  font-size: 11px;
  padding: 0 2px;
  line-height: 1;
}

.close:hover {
  color: #e74c3c;
}

.title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.body {
  margin-top: 2px;
  font-size: 11.5px;
  line-height: 1.35;
  color: #bbbbbb;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.versions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 12px;
}

.v-old, .v-new {
  padding: 1px 6px;
  border-radius: 3px;
  white-space: nowrap;
}

.v-old {
  color: #9a9a9a;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid #3a3a3a;
}

.arrow {
  color: #f39c12;
  font-weight: 700;
  letter-spacing: 1px;
}

.v-new {
  color: #2ecc71;
  font-weight: 700;
  background: rgba(46, 204, 113, 0.12);
  border: 1px solid rgba(46, 204, 113, 0.45);
}

.notification[data-kind="addon-error"] .v-new {
  color: #e74c3c;
  background: rgba(231, 76, 60, 0.12);
  border-color: rgba(231, 76, 60, 0.45);
  text-decoration: line-through;
}

.timer {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 2px;
  background: rgba(255, 255, 255, 0.06);
}

.timer-fill {
  width: 100%;
  height: 100%;
  background: var(--kind);
}
</style>
</head>
<body>
<div class="notification" id="notification" data-kind="chat">
  <div class="head">
    <span class="icon" id="icon">✉</span>
    <span class="kind" id="kind">Сообщение</span>
    <span class="close" id="close" title="Закрыть">✕</span>
  </div>
  <div class="title" id="title"></div>
  <div class="body" id="body"></div>
  <div class="versions" id="versions" style="display: none;">
    <span class="v-old" id="v-old"></span>
    <span class="arrow">&gt;&gt;</span>
    <span class="v-new" id="v-new"></span>
  </div>
  <div class="timer"><div class="timer-fill" id="timer-fill"></div></div>
</div>

<script>
const { ipcRenderer } = require('electron');

const card = document.getElementById('notification');
const iconEl = document.getElementById('icon');
const kindEl = document.getElementById('kind');
const titleEl = document.getElementById('title');
const bodyEl = document.getElementById('body');
const versionsEl = document.getElementById('versions');
const oldEl = document.getElementById('v-old');
const newEl = document.getElementById('v-new');
const closeEl = document.getElementById('close');
const fill = document.getElementById('timer-fill');

const KIND_META = {
  'chat': { icon: '✉', label: 'Сообщение' },
  'addon-update': { icon: '⟳', label: 'Обновление аддона' },
  'addon-error': { icon: '!', label: 'Ошибка обновления' },
};

let payload = null;
let duration = 5000;
let remaining = 5000;
let startedAt = 0;
let hideTimer = null;
let dismissed = false;
let paused = false;

function clearHideTimer() {
  if (hideTimer) {
    clearTimeout(hideTimer);
    hideTimer = null;
  }
}

function dismiss() {
  if (dismissed) return;
  dismissed = true;
  clearHideTimer();
  card.classList.add('fade-out');
  setTimeout(() => ipcRenderer.send('dismiss-notification'), 150);
}

function activate() {
  if (dismissed) return;
  if (payload && payload.kind !== 'chat' && payload.addon) {
    ipcRenderer.send('addon-notification-clicked', payload.addon);
  } else {
    ipcRenderer.send('notification-clicked');
  }
  dismiss();
}

function resumeTimer() {
  if (dismissed) return;
  paused = false;
  startedAt = Date.now();
  clearHideTimer();
  hideTimer = setTimeout(dismiss, remaining);

  const pct = Math.max(0, Math.min(100, (remaining / duration) * 100));
  fill.style.transition = 'none';
  fill.style.width = pct + '%';
  requestAnimationFrame(() => {
    if (dismissed || paused) return;
    fill.style.transition = 'width ' + remaining + 'ms linear';
    fill.style.width = '0%';
  });
}

function pauseTimer() {
  if (dismissed || paused) return;
  paused = true;
  clearHideTimer();
  remaining = Math.max(0, remaining - (Date.now() - startedAt));
  const pct = Math.max(0, Math.min(100, (remaining / duration) * 100));
  fill.style.transition = 'none';
  fill.style.width = pct + '%';
}

function render(data) {
  clearHideTimer();
  dismissed = false;
  paused = false;
  card.classList.remove('fade-out');

  payload = data && typeof data === 'object' ? data : {};
  const kind = KIND_META[payload.kind] ? payload.kind : 'chat';
  const meta = KIND_META[kind];

  card.dataset.kind = kind;
  iconEl.textContent = meta.icon;
  kindEl.textContent = meta.label;
  titleEl.textContent = payload.title || '';

  const hasVersions = kind !== 'chat' && !!payload.from && !!payload.to;
  versionsEl.style.display = hasVersions ? 'flex' : 'none';
  if (hasVersions) {
    oldEl.textContent = payload.from;
    newEl.textContent = payload.to;
  }

  const bodyText = payload.body || '';
  const showBody = kind === 'chat' ? !!bodyText : !hasVersions && !!bodyText;
  bodyEl.style.display = showBody ? 'block' : 'none';
  bodyEl.textContent = showBody ? bodyText : '';

  const d = Number(payload.duration);
  duration = Number.isFinite(d) && d > 0 ? d : 5000;
  remaining = duration;

  fill.style.transition = 'none';
  fill.style.width = '100%';

  // Высота окна = высота контента. Показываем только после подгонки,
  // чтобы не было прыжка и обрезанного текста.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      ipcRenderer.send('notification-ready', { height: card.offsetHeight });
      resumeTimer();
    });
  });
}

ipcRenderer.on('show-notification', (event, data) => render(data));

card.addEventListener('click', activate);
card.addEventListener('mouseenter', pauseTimer);
card.addEventListener('mouseleave', () => {
  if (!dismissed && paused) resumeTimer();
});

closeEl.addEventListener('click', (event) => {
  event.stopPropagation();
  dismiss();
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') dismiss();
});
</script>
</body>
</html>
